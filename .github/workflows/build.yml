name: Build

# Baut die Windows-.exe und die macOS-App. Bei einem Tag v* zusätzlich ein
# Release mit beiden Dateien; sonst liegen sie unter "Artifacts" des Laufs.
on:
  push:
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - run: cargo test
      - run: cargo build --release
      - uses: actions/upload-artifact@v4
        with:
          name: claude-slots-windows
          path: target/release/claude-slots.exe

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: cargo test
      - run: scripts/macos-app.sh
      - uses: actions/upload-artifact@v4
        with:
          name: claude-slots-macos
          path: target/macos/claude-slots-macos.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/claude-slots.exe
            dist/claude-slots-macos.zip
